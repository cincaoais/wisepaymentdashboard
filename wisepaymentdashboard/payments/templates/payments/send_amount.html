{% extends "base.html" %}

{% block content %}
<h1 class="h3 mb-3">Send money</h1>
{% include "payments/_wizard_steps.html" %}

<div class="card" style="max-width: 32rem;">
  <div class="card-body">
    <p class="text-secondary">Route: <strong>GBP balance → EUR bank account (IBAN)</strong>. Wise locks the price for about 30 minutes.</p>
    <form method="post">
      {% csrf_token %}
      {% include "payments/_form_fields.html" %}
      <button class="btn btn-primary">Get a quote ▸</button>
    </form>
  </div>
</div>
{% endblock %}
