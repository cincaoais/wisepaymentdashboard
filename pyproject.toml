[project]
name = "wisepaymentdashboard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wisepaymentdashboard.settings"
pythonpath = ["wisepaymentdashboard"]
testpaths = ["wisepaymentdashboard"]
